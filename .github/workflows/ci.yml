name: package-and-rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate specification package
        run: python3 tools/run_checks.py --profile docs --work-id WORK-0009 --run-id "ci-${{ github.run_id }}-${{ github.run_attempt }}"

  workflow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test department workflow and packaging
        run: python3 tools/run_checks.py --profile workflow --work-id WORK-0009 --run-id "ci-${{ github.run_id }}-${{ github.run_attempt }}" --bundle

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check toolchain
        run: rustc --version && cargo --version
      - name: Check and build Rust department
        run: python3 tools/run_checks.py --profile rust --work-id WORK-0009 --run-id "ci-${{ github.run_id }}-${{ github.run_attempt }}" --bundle
