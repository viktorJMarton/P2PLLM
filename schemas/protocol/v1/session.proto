syntax = "proto3";
package p2pai.v1;

// DRAFT. Not a complete security protocol. Auth/session binding and bounds in RFCs.
message Envelope {
  uint32 protocol_major = 1;
  string session_id = 2;
  string task_id = 3;
  uint64 step_id = 4;
  bytes message_id = 5;
  oneof body {
    Hello hello = 10;
    Capabilities capabilities = 11;
    TaskOffer task_offer = 12;
    TaskDecision task_decision = 13;
    ComputeStep compute_step = 14;
    StepResult step_result = 15;
    TaskStatus task_status = 16;
    TaskEnd task_end = 17;
    ProtocolError error = 18;
  }
}
message Hello { uint32 min_major = 1; uint32 max_major = 2; bytes authenticated_peer_id = 3; }
message Capabilities { repeated string operations = 1; repeated string composition_ids = 2; repeated string profile_ids = 3; uint64 max_frame_bytes = 4; }
message TaskOffer { string operation = 1; string composition_id = 2; string profile_id = 3; uint64 timeout_ms = 4; uint64 max_memory_bytes = 5; uint64 max_transfer_bytes = 6; bytes request_digest = 7; }
message TaskDecision { bool accepted = 1; string reason_code = 2; }
message ComputeStep { string input_format = 1; bytes payload_handle = 2; bytes request_digest = 3; }
message StepResult { string output_format = 1; bytes payload_handle = 2; bytes request_digest = 3; }
message TaskStatus { string state = 1; }
message TaskEnd { string reason_code = 1; }
message ProtocolError { string code = 1; string safe_description = 2; }
// Large payloads use separately bounded frames bound to session/task/step.
// No field accepts executable code. Format/profile strings must match local allowlists.
